<title>NexusShop — Trusted Pakistani shops, pay on delivery</title>

<style>
:root{--bg:#e9e2d3;--bg2:#efe8d9;--sf:#f6f1e4;--sf2:#fbf8ef;--ln:#d9d0bb;--ln2:#c9bfa6;
--ink:#26221b;--ink2:#3a3428;--mut:#6b6355;--fnt:#8a8172;--grn:#1d5c3f;--grn2:#2f6b4f;--grn3:#4c8b6a;
--mint:#dcead9;--wa:#1d6b45;--gold:#8a6d1f;--goldbg:#f3e8c8;--red:#a33a2a;--redbg:#f4ded8;
--r:16px;--sh:0 10px 30px rgba(38,34,27,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.55;
background-image:radial-gradient(1100px 480px at 85% -10%,rgba(76,139,106,.10),transparent 60%),radial-gradient(900px 420px at -10% 110%,rgba(138,109,31,.08),transparent 60%)}
body.ur{font-family:'Noto Nastaliq Urdu','Segoe UI',serif}
body.ur h1,body.ur h2,body.ur h3{line-height:1.95}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--grn3);border-radius:8px;border:2px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--grn)}
*{scrollbar-width:thin;scrollbar-color:var(--grn3) var(--bg2)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s,filter .15s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--grn2);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%}
img{display:block;max-width:100%}
header{position:sticky;top:0;z-index:60;background:rgba(233,226,211,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;white-space:nowrap}.logo b{color:var(--grn)}
.sw{flex:1;min-width:130px;position:relative}.sw input{padding-inline-start:34px;border-radius:999px;background:var(--sf)}
.sw .sic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.icb{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 12px;font-size:14px;position:relative;color:var(--ink2)}
.icb:hover{filter:brightness(.97)}
.bdg{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--grn);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.banner{background:var(--goldbg);border-bottom:1px solid var(--ln);color:var(--gold);font-size:12px;text-align:center;padding:7px 12px;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px 14px 110px}
.view{animation:rise .3s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,var(--sf),var(--bg2));border:1px solid var(--ln);border-radius:24px;padding:30px 22px;margin-bottom:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(76,139,106,.20),transparent 70%)}
.hero h1{font-size:clamp(26px,4.4vw,38px);line-height:1.2;margin-bottom:10px;max-width:640px}
.hero p{color:var(--mut);font-size:14px;margin-bottom:16px;max-width:560px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink);color:var(--sf);border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 6px 16px rgba(38,34,27,.12)}
.btn:hover{filter:brightness(1.12)}.btn.grn{background:var(--grn);color:#fff}.btn.wa{background:var(--wa);color:#fff}
.btn.gh{background:transparent;border:1px solid var(--ink);color:var(--ink);box-shadow:none}.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
.btn.red{background:var(--red);color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn[disabled]{opacity:.5;cursor:not-allowed}
.trust{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--mut)}
.live{position:relative;overflow:hidden;border-radius:18px;margin:14px 0;padding:16px;border:1px solid var(--ln);background:linear-gradient(120deg,var(--goldbg),var(--mint),var(--goldbg));background-size:220% 220%;animation:grad 9s ease infinite}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.live b{font-size:15px}.live span{display:block;font-size:12px;color:var(--ink2);margin-top:4px}
h2.sec{font-size:19px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:18px;height:3px;background:var(--grn);border-radius:2px;flex:none}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tb select{width:auto;padding:8px 12px;border-radius:999px;font-size:13px;background:var(--sf)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chips.sticky{position:sticky;top:102px;z-index:40;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 6px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--grn);color:#fff;border-color:var(--grn);box-shadow:0 4px 12px rgba(29,92,63,.25)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(38,34,27,.06);transition:transform .18s,box-shadow .18s}
.pc:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.pc .img{height:150px;background:var(--bg2);object-fit:cover;width:100%}
.pc .bd{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{font-size:14px;font-weight:700;text-align:start;color:var(--ink)}
.pr{color:var(--grn);font-weight:800;font-size:15px}.old{color:var(--fnt);text-decoration:line-through;font-size:12px}
.off{position:absolute;top:8px;inset-inline-start:8px;background:var(--gold);color:#fff;font-size:11px;border-radius:8px;padding:3px 7px}
.ht{position:absolute;top:8px;inset-inline-end:8px;background:rgba(246,241,228,.9);backdrop-filter:blur(4px);border:1px solid var(--ln);border-radius:999px;width:32px;height:32px;font-size:15px;color:var(--mut)}
.ht.on{color:var(--red);animation:pop .25s}@keyframes pop{50%{transform:scale(1.25)}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(38,34,27,.05)}
.mut{color:var(--mut);font-size:13px}.fnt{color:var(--fnt);font-size:12px}
.det{display:grid;gap:16px}@media(min-width:820px){.det{grid-template-columns:1fr 1fr}}
.det .img{border-radius:var(--r);height:320px;object-fit:cover;width:100%;background:var(--bg2)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:12px;background:var(--sf2)}
.qty button{width:36px;height:36px;font-size:18px;color:var(--ink2)}.qty span{min-width:36px;text-align:center}
.tc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.sl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cg{border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--sf)}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.ci:last-of-type{border-bottom:none}.ci img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.ci .gw{flex:1;min-width:0}.tot{display:flex;justify-content:space-between;font-weight:700;padding:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(233,226,211,.96);backdrop-filter:blur(10px);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mut);position:relative;padding:6px 0;border-radius:14px}
nav button.on{color:var(--grn);font-weight:700;background:var(--mint)}nav .ico{font-size:18px}
.chk{width:60px;height:60px;border-radius:50%;background:var(--grn);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;animation:pop .4s}
.ctr{text-align:center}.oc{font-family:Georgia,serif;font-size:20px;letter-spacing:1px;font-weight:700;margin:6px 0}
.st{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;background:var(--bg2);border:1px solid var(--ln);color:var(--mut)}
.st.placed{color:var(--gold);background:var(--goldbg);border-color:var(--gold)}
.st.delivered{color:var(--grn);background:var(--mint);border-color:var(--grn3)}
.st.paused{color:var(--red);background:var(--redbg);border-color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(38,34,27,.5);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal .box{background:var(--sf);border-radius:20px;padding:20px;max-width:540px;width:100%;max-height:86vh;overflow:auto;box-shadow:var(--sh);animation:rise .25s}
.steps{display:flex;flex-direction:column;margin:14px 0}
.step{display:flex;gap:12px;align-items:flex-start}.step .dot{width:14px;height:14px;border-radius:50%;background:var(--ln2);margin-top:4px;flex:none}
.step.done .dot{background:var(--grn)}
.step .lbl{font-size:13px;padding-bottom:18px;border-inline-start:2px solid var(--ln);margin-inline-start:-8px;padding-inline-start:18px;color:var(--mut)}
.step.done .lbl{color:var(--ink)}.step:last-child .lbl{border:none;padding-bottom:0}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
details{border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--sf)}
summary{cursor:pointer;font-weight:700;color:var(--ink2)}details p{margin-top:8px;font-size:13px;color:var(--mut);white-space:pre-line}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--sf);padding:10px 16px;border-radius:999px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .25s;max-width:92vw;display:flex;gap:12px;align-items:center;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{color:var(--goldbg);font-weight:700;text-decoration:underline}
.empty{padding:44px 10px;text-align:center;color:var(--mut)}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;color:var(--ink2)}
.menu button:hover{background:var(--mint)}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.rail .rc{flex:0 0 150px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 10px rgba(38,34,27,.06)}
.rail .rc img{height:100px;width:100%;object-fit:cover;background:var(--bg2)}.rail .rc .b{padding:8px}
#welcome{position:fixed;inset:0;z-index:300;background:radial-gradient(900px 500px at 70% -10%,rgba(76,139,106,.16),transparent),radial-gradient(700px 420px at 10% 110%,rgba(138,109,31,.12),transparent),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:auto}
#welcome .ring{perspective:900px;width:230px;height:150px;margin-bottom:10px}
#welcome .spin{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:spin 18s linear infinite}
@keyframes spin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
#welcome .spin img{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;object-fit:cover;border-radius:16px;border:1px solid var(--ln2);box-shadow:0 10px 26px rgba(38,34,27,.25)}
#welcome h1{font-size:38px;margin:6px 0}#welcome h1 b{color:var(--grn)}
#welcome .tag{color:var(--grn2);font-weight:700;font-size:14px;margin-bottom:14px}
#welcome .pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
#welcome .pills span{font-size:11px;border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 10px;color:var(--ink2)}
#raahFab{position:fixed;inset-inline-end:14px;bottom:86px;z-index:110;width:54px;height:54px;border-radius:50%;background:var(--grn);color:#fff;font-size:24px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer}
#raah{position:fixed;inset-inline-end:14px;bottom:150px;z-index:115;width:min(360px,calc(100vw - 28px));max-height:60vh;background:var(--sf);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--sh);display:flex;flex-direction:column;overflow:hidden;animation:rise .25s}
#raah .hd{background:var(--grn);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
#raah .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--sf2)}
#raah .m{max-width:85%;padding:8px 12px;border-radius:14px;font-size:13px;white-space:pre-line}
#raah .m.u{align-self:flex-end;background:var(--grn);color:#fff;border-end-end-radius:4px}
#raah .m.a{align-self:flex-start;background:var(--sf);border:1px solid var(--ln);border-end-start-radius:4px}
#raah .chips{padding:8px 10px 0;background:var(--sf2)}
#raah .ft{display:flex;gap:8px;padding:10px;background:var(--sf)}#raah .ft input{border-radius:999px}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes bl{50%{opacity:.25}}
.rev{border-top:1px solid var(--ln);padding:10px 0}.stars{color:var(--gold)}
.lrow{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;background:var(--sf2);flex-wrap:wrap}
.lrow img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.lrow .gw{flex:1;min-width:0}.lrow>.row{width:100%;justify-content:flex-end}
.bankcard{background:linear-gradient(135deg,var(--grn),var(--grn2));color:#fff;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 8px 20px rgba(29,92,63,.25)}
.bankcard .n{font-family:Georgia,serif;font-size:18px;letter-spacing:2px}
table.nxt{width:100%;border-collapse:collapse;font-size:12px}
table.nxt td,table.nxt th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:start;vertical-align:top}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--grn)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 1s ease 2}
@media(max-width:480px){.hero{padding:22px 16px}#welcome h1{font-size:30px}}
</style>
</head>

async function raahSend(text){if(!text)return;S.raahMsgs.push({role:"u",text});S.raahTyping=true;save();render();
 let answer=null;
 try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
  const r=await fetch("/api/raahnuma",{method:"POST",headers:{"Content-Type":"application/json","x-nx-client":"nx-web-v20"},body:JSON.stringify({prompt:text,lang:S.lang}),signal:ctl.signal});clearTimeout(to);
  if(r.ok){const j=await r.json();if(j&&j.text)answer=j.text;}else if(r.status===429){toast(S.lang==="ur"?"راہنما: استعمال کی حد، ایک منٹ بعد کوشش کریں":"Raahnuma: rate limit, try again in a minute");}
 }catch(e){}
 if(!answer)answer=raahAnswer(text);
 S.raahTyping=false;S.raahMsgs.push({role:"a",text:answer});save();render();}

 switch(a){
 case "enter":sessionStorage.setItem("nx_in","1");render();break;
 case "lang":S.lang=S.lang==="en"?"ur":"en";save();render();toast(t("langSet"));break;
 case "menu":S.menu=!S.menu;render();break;

 case "payfocus":S.view="seller";S.payFocus=true;save();render();window.scrollTo(0,0);break;
 case "nav":S.view=el.dataset.v;S.track=null;S.menu=false;S.editId=null;save();render();window.scrollTo(0,0);break;
 case "shopnow":S.view="home";render();setTimeout(()=>{const g=document.getElementById("grid");if(g)g.scrollIntoView({behavior:"smooth"});},60);break;
 case "cat":S.cat=id;render();break;
 case "open":{S.pid=id;S.qty=1;S.view="detail";const p=prod(id);if(p){S.hist.unshift({id,cat:p.cat});S.hist=S.hist.slice(0,60);}save();render();window.scrollTo(0,0);break;}
 case "save":{const i=S.saved.indexOf(id);if(i>=0){S.saved.splice(i,1);toast(t("unsavedT"));}else{S.saved.push(id);toast(t("savedT"));}save();render();break;}
 case "add":addCart(id,1);break;
 case "addq":addCart(id,S.qty);break;
 case "buy":addCart(id,S.qty);S.view="cart";render();break;
 case "q":S.qty=Math.max(1,S.qty+Number(el.dataset.d));render();break;
 case "cq":{const it=S.cart.find(x=>x.id===id);if(it){it.q+=Number(el.dataset.d);if(it.q<1)S.cart=S.cart.filter(x=>x.id!==id);}save();render();break;}
 case "rm":{const snap=S.cart.slice();S.cart=S.cart.filter(x=>x.id!==id);S.bulk=S.bulk.filter(x=>x!==id);save();render();toast(t("removed"),()=>{S.cart=snap;save();render();});break;}
 case "bulkToggle":{const i=S.bulk.indexOf(id);if(i>=0)S.bulk.splice(i,1);else S.bulk.push(id);save();render();break;}
 case "bulkAll":{S.bulk=el.checked?S.cart.map(x=>x.id):[];save();render();break;}
 case "bulkRemove":{if(!S.bulk.length)break;const snap=S.cart.slice();S.cart=S.cart.filter(x=>!S.bulk.includes(x.id));S.bulk=[];save();render();toast(t("removed"),()=>{S.cart=snap;save();render();});break;}
 case "clearCart":{const snap=S.cart.slice();S.cart=[];S.bulk=[];save();render();toast(t("removed"),()=>{S.cart=snap;save();render();});break;}
 case "undo":if(_undo){const f=_undo;_undo=null;f();}break;

<div class="row"><span>${PT("iban")}</span><span><b>${esc(rail?rail.iban:"—")}</b> <button class="btn gh sm" data-nx="copy" data-id="iban">${PT("copy")}</button></span></div>
<div class="row"><span>${PT("deadline")}</span><b>${new Date(o.expires_at).toLocaleString()}</b></div>
<p class="mut">${esc(S.lang==="ur"?(rail?rail.instructions_ur:""):(rail?rail.instructions_en:""))}</p>
<p class="fnt" style="color:var(--red)">⚠ ${PT("warn")}</p>
<label>${PT("tid")}</label><input id="nxTid"><label>${PT("receipt")}</label><input id="nxRc" type="file" accept="image/*">
<button class="btn wa" data-nx="submit" data-id="${o.id}">📨 ${PT("submit")}</button><div class="fnt" id="nxSubE" style="color:var(--red)"></div></div>`;}
function sellerCard(){
 if(!ready)return `<div class="card" data-nxsec-view>${payhero()}<p class="mut">${PT("connecting")}</p></div>`;
 if(!session)return `<div class="card" data-nxsec-view style="border-color:var(--grn3)">${payhero()}<p class="mut">${PT("payIntro")}</p><button class="btn grn" data-nx="login">🔐 ${PT("login")}</button></div>`;
 if(!shop)return `<div class="card" data-nxsec-view style="border-color:var(--grn3)">${payhero()}<label>${PT("shopName")}</label><input id="nxShN"><label>${PT("city")}</label><input id="nxShC"><label>${PT("wa")}</label><input id="nxShW" placeholder="+92..."><button class="btn grn" data-nx="shop">${PT("createShop")}</button><div class="fnt" id="nxShE" style="color:var(--red)"></div></div>`;
 var aw=orders.filter(function(o){return o.status==="awaiting_payment";});
 return `<div class="card" data-nxsec-view style="border-color:var(--grn3)">${payhero()}${stepper()}
 ${sub?"":planTiles()+`<label>${PT("method")}</label><select id="nxMethod">${((rail&&rail.active_methods)||["bank_transfer"]).map(function(m){return `<option value="${m}">${m}</option>`;}).join("")}</select>
 <button class="btn grn" data-nx="order">⚡ ${PT("createOrder")}</button><div class="fnt" id="nxOrderErr" style="color:var(--red)"></div>`}
 ${aw.length?instrBlock(aw[0]):""}
 <h2 class="sec">${PT("openOrders")}</h2>
 ${orders.length?`<div class="otl">${orders.map(function(o){var cls=o.status==="confirmed"?"c":(o.status==="rejected"?"r":(o.status==="under_review"?"u":""));
  return `<div class="oi ${cls}"><div class="sl"><b>${esc(o.ref)}</b><span class="st ${st_(o.status)}">${o.status}</span></div><div class="mut">${esc(o.plan_code)} · ${money(o.amount_pkr)} · ${new Date(o.created_at).toLocaleDateString()}</div>${o.review_note?`<p class="fnt">${PT("note")}: ${esc(o.review_note)}</p>`:""}</div>`;}).join("")}</div>`:`<p class="mut">${PT("none")}</p>`}
 <h2 class="sec">${PT("invoices")}</h2>
 ${invs.length?invs.map(function(i){return `<div class="row" style="justify-content:space-between"><span>🧾 ${esc(i.number)} · ${esc(i.kind)}</span><button class="btn gh sm" data-nx="inv" data-id="${i.id}">🖨 ${PT("print")}</button></div>`;}).join(""):`<p class="mut">—</p>`}</div>`;}
function adminOv(){var dups=stats.dup_tids||[];
 return `<div class="modal" data-nxov style="z-index:150"><div class="box" style="max-width:780px">
 <div class="sl"><b>🛡️ ${PT("admin")}</b><button class="btn gh sm" data-nx="close">✕</button></div>
 <div class="kpis"><div class="kpi"><b>${stats.under_review||0}</b><span>${PT("queue")}</span></div><div class="kpi"><b>${stats.confirmed||0}</b><span>${PT("confirmed")}</span></div><div class="kpi"><b>${money(stats.mrr_pkr||0)}</b><span>MRR</span></div><div class="kpi"><b>${money(stats.confirmed_pkr_month||0)}</b><span>${PT("month")}</span></div><div class="kpi"><b>${stats.shops||0}</b><span>Shops</span></div></div>
 <h2 class="sec">${PT("queue")}</h2>
 ${queue.length?`<table class="nxt"><tr><th>Ref</th><th>Shop</th><th>Amount</th><th>TID</th><th></th></tr>${queue.map(function(o){return `<tr><td><b>${esc(o.ref)}</b><br><span class="fnt">${esc(o.plan_code)} · ${esc(o.method)}</span></td><td>${esc(o.nx_shops?o.nx_shops.name:"")}</td><td>${money(o.amount_pkr)}</td><td>${esc(o.tid)} ${dups.indexOf(o.tid)>=0?`<span class="off" style="position:static">${PT("dup")}</span>`:""}</td><td><button class="btn grn sm" data-nx="approve" data-id="${o.id}">${PT("approve")}</button> <button class="btn red sm" data-nx="reject" data-id="${o.id}">${PT("reject")}</button></td></tr>`;}).join("")}</table>`:`<p class="mut">—</p>`}
 <h2 class="sec">${PT("confirmed")}</h2>
 ${conf.length?`<table class="nxt"><tr><th>Ref</th><th>Shop</th><th>Amount</th><th>Invoice</th><th></th></tr>${conf.map(function(o){return `<tr><td>${esc(o.ref)}</td><td>${esc(o.nx_shops?o.nx_shops.name:"")}</td><td>${money(o.amount_pkr)}</td><td>${esc(o.invoices?o.invoices.number:"—")}</td><td><button class="btn gold sm" data-nx="refund" data-id="${o.id}">${PT("refund")}</button></td></tr>`;}).join("")}</table>`:`<p class="mut">—</p>`}
 <h2 class="sec">${PT("settlement")}</h2>
 <div class="row"><input type="month" id="nxPer" value="${new Date().toISOString().slice(0,7)}" style="max-width:170px"><input id="nxRate" type="number" step="0.0001" value="0.0033" style="max-width:110px"><button class="btn" data-nx="gen">${PT("generate")}</button></div>
 <div id="nxSetBox"></div>
 <h2 class="sec">${PT("audit")}</h2>
 <table class="nxt"><tr><th>When</th><th>Action</th><th>Entity</th></tr>${audit.map(function(a){return `<tr><td class="fnt">${new Date(a.created_at).toLocaleString()}</td><td><b>${esc(a.action)}</b></td><td class="fnt">${esc(a.entity)} ${esc(a.entity_id||"").slice(0,8)}</td></tr>`;}).join("")}</table>
 </div></div>`;}
function authOv(){return `<div class="modal" data-nxov><div class="box" style="max-width:380px"><b>🔐 ${PT("login")}</b>
<button class="btn" style="background:#fff;color:#333;border:1px solid var(--ln);width:100%;margin:10px 0" data-nx="google">G · Continue with Google · Google کے ساتھ</button>
<div class="mut" style="text-align:center;margin:6px 0">— or / یا —</div>
<label>${PT("email")}</label><input id="nxEm" type="email"><label>${PT("pass")}</label><input id="nxPw" type="password">
<button class="btn grn" data-nx="authLogin">${PT("login")}</button><button class="btn gh" data-nx="authSignup">${PT("signup")}</button>
<div class="fnt" id="nxAuthE" style="color:var(--red)"></div>
<div class="fnt" style="margin-top:8px">Phone login arrives in Phase 5 (SMS/WhatsApp OTP) · فون لاگ ان فیز 5 میں آئے گا</div>
<button class="btn gh sm" data-nx="closeAuth" style="margin-top:10px">✕</button></div></div>`;}
function injectView(){document.querySelectorAll("[data-nxsec-view]").forEach(function(e){e.remove();});
 var menu=document.querySelector("[data-nxmenu]");if(menu)menu.remove();
 if(S.view==="seller"){var v=document.querySelector("main .view");if(v){v.insertAdjacentHTML("afterbegin",sellerCard());
  if(S.payFocus){var c=v.querySelector("[data-nxsec-view]");if(c){c.classList.add("flash");c.scrollIntoView({behavior:"smooth",block:"center"});}S.payFocus=false;}}}
 if(S.view==="account"){var m=document.querySelector(".menu");if(m)m.insertAdjacentHTML("afterbegin",`<div class="menu" data-nxmenu style="margin:0 0 8px"><button data-nx="goseller">💳 ${PT("goPay")}<span>›</span></button>${role?`<button data-nx="admin">🛡️ ${PT("admin")}<span>›</span></button>`:""}</div>`);}}
function printDoc(html){var w=window.open("","_blank");if(!w)return;w.document.write(html);w.document.close();setTimeout(function(){try{w.print();}catch(e){}},400);}
function invHtml(i){var o=i.payment_orders||{};return `<html><head><title>${esc(i.number)}</title><style>body{font-family:Georgia,serif;padding:32px;color:#222}h1{font-size:22px}table{width:100%;border-collapse:collapse;margin-top:16px}td{padding:8px;border-bottom:1px solid #ddd;font-size:14px}</style></head><body><h1>NexusShop — ${i.kind==="receipt"?"PAYMENT RECEIPT":"PROFORMA (not a receipt)"}</h1><table><tr><td>Invoice</td><td><b>${esc(i.number)}</b></td></tr><tr><td>Order ref</td><td>${esc(o.ref||"")}</td></tr><tr><td>Plan</td><td>${esc(o.plan_code||"")}</td></tr><tr><td>Amount</td><td><b>${money(i.amount_pkr)} PKR</b></td></tr><tr><td>Issued</td><td>${new Date(i.issued_at).toLocaleString()}</td></tr><tr><td>Status</td><td>${esc(o.status||"")}</td></tr></table><p style="margin-top:20px;font-size:12px;color:#666">NexusShop · Lahore, Pakistan · neuralfocusai@gmail.com</p></body></html>`;}
document.addEventListener("click",function(e){var el=e.target.closest("[data-nx]");if(!el)return;var a=el.dataset.nx,id=el.dataset.id;
 if(a==="login"){document.body.insertAdjacentHTML("beforeend",authOv());}
 if(a==="closeAuth"||a==="close"){document.querySelectorAll("[data-nxov]").forEach(function(o){o.remove();});}
 if(a==="google"){sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}}).then(function(r){if(r.error){var e2=document.getElementById("nxAuthE");if(e2)e2.textContent=r.error.message;}});}
 if(a==="pick"){pickPlan=id;document.querySelectorAll(".plansel").forEach(function(b){var on=b.dataset.id===pickPlan;b.classList.toggle("on",on);var tk=b.querySelector(".tick");if(tk)tk.style.display=on?"flex":"none";});}
 if(a==="authLogin"){sb.auth.signInWithPassword({email:document.getElementById("nxEm").value,password:document.getElementById("nxPw").value}).then(function(r){if(r.error)document.getElementById("nxAuthE").textContent=r.error.message;else{document.querySelectorAll("[data-nxov]").forEach(function(o){o.remove();});refresh();}});}
 if(a==="authSignup"){sb.auth.signUp({email:document.getElementById("nxEm").value,password:document.getElementById("nxPw").value}).then(function(r){if(r.error)document.getElementById("nxAuthE").textContent=r.error.message;else if(!r.data.session)document.getElementById("nxAuthE").textContent=PT("checkMail");else{document.querySelectorAll("[data-nxov]").forEach(function(o){o.remove();});refresh();}});}
 if(a==="goseller"){S.view="seller";S.payFocus=true;save();render();}
 if(a==="admin"){if(!document.querySelector("[data-nxov]"))document.body.insertAdjacentHTML("beforeend",adminOv());}
 if(a==="shop"){sb.from("nx_shops").insert({owner_id:session.user.id,name:document.getElementById("nxShN").value,city:document.getElementById("nxShC").value,wa:document.getElementById("nxShW").value}).select().then(function(r){if(r.error)document.getElementById("nxShE").textContent=r.error.message;else refresh();});}
 if(a==="order"){sb.rpc("nx_create_payment_order",{p_plan_code:pickPlan||"pro",p_method:document.getElementById("nxMethod").value}).then(function(r){if(r.error)document.getElementById("nxOrderErr").textContent=r.error.message;else refresh();});}
 if(a==="copy"){var v=(id==="iban"&&rail)?rail.iban:(rail?(rail.account_number||rail.iban):"");if(!v)v=(id==="iban")?RAIL.iban:RAIL.acc;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(function(){toast(PT("copied"));});else{var ta=document.createElement("textarea");ta.value=v;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast(PT("copied"));}}
 if(a==="submit"){var tid=document.getElementById("nxTid").value;var fi=document.getElementById("nxRc").files[0];var err=document.getElementById("nxSubE");
  var send=function(path){sb.rpc("nx_submit_payment",{p_order_id:id,p_tid:tid,p_receipt_url:path}).then(function(r){if(r.error)err.textContent=r.error.message;else refresh();});};
  if(!tid){err.textContent=PT("tid");return;}
  if(fi){sb.storage.from("receipts").upload(id+"/"+Date.now()+"_"+fi.name,fi).then(function(u){if(u.error){err.textContent=u.error.message;return;}send(u.data.path);});}else send(null);}
 if(a==="inv"){var i=invs.find(function(x){return x.id===id;});if(i)printDoc(invHtml(i));}
 if(a==="approve"){var note=prompt(PT("note"),"")||"";sb.rpc("nx_approve_payment",{p_order_id:id,p_note:note}).then(function(r){if(r.error)alert(r.error.message);else refresh();});}
 if(a==="reject"){var n2="";while(!n2.trim())n2=prompt(PT("note"))||"";sb.rpc("nx_reject_payment",{p_order_id:id,p_note:n2}).then(function(r){if(r.error)alert(r.error.message);else refresh();});}
 if(a==="refund"){var amt=prompt(PT("amount"),"2500");if(amt===null)return;var rs="";while(!rs.trim())rs=prompt(PT("reason"))||"";sb.rpc("nx_create_refund",{p_order_id:id,p_amount_pkr:Number(amt),p_reason:rs}).then(function(r){if(r.error)alert(r.error.message);else refresh();});}
 if(a==="gen"){var per=document.getElementById("nxPer").value;var from=per+"-01T00:00:00Z";var to=per+"-31T23:59:59Z";
  sb.from("payment_orders").select("amount_pkr,plan_code,ref,reviewed_at,nx_shops(name)").eq("status","confirmed").gte("reviewed_at",from).lte("reviewed_at",to).then(function(r){
   lastSet=r.data||[];lastSetPer=per;var total=lastSet.reduce(function(a,b){return a+b.amount_pkr;},0);var by={};lastSet.forEach(function(x){by[x.plan_code]=(by[x.plan_code]||0)+1;});
   document.getElementById("nxSetBox").innerHTML=`<table class="nxt"><tr><th>${PT("month")}</th><th>Orders</th><th>Total</th><th>Plans</th></tr><tr><td><b>${per}</b></td><td>${lastSet.length}</td><td><b>${money(total)}</b></td><td>${Object.keys(by).map(function(k){return k+"×"+by[k];}).join(", ")||"—"}</td></tr></table><div class="row" style="margin-top:8px"><button class="btn gh sm" data-nx="csv">${PT("csv")}</button><button class="btn gh sm" data-nx="printset">${PT("printPdf")}</button><button class="btn grn sm" data-nx="record">${PT("record")}</button></div>`;});}
 if(a==="csv"&&lastSet){var csv="ref,shop,plan,amount_pkr,reviewed_at\n"+lastSet.map(function(x){return x.ref+",'"+(x.nx_shops?x.nx_shops.name:"")+"',"+x.plan_code+","+x.amount_pkr+","+x.reviewed_at;}).join("\n");var a2=document.createElement("a");a2.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a2.download="nexusshop-settlement-"+lastSetPer+".csv";a2.click();}
 if(a==="printset"&&lastSet){var tot=lastSet.reduce(function(a,b){return a+b.amount_pkr;},0);printDoc(`<html><head><title>Settlement ${lastSetPer}</title></head><body style="font-family:Georgia,serif;padding:32px"><h2>NexusShop — Settlement ${lastSetPer}</h2><p>Orders: ${lastSet.length} · Total: ${money(tot)} PKR</p><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%"><tr><th>Ref</th><th>Shop</th><th>Plan</th><th>PKR</th></tr>${lastSet.map(function(x){return `<tr><td>${x.ref}</td><td>${esc(x.nx_shops?x.nx_shops.name:"")}</td><td>${x.plan_code}</td><td>${x.amount_pkr}</td></tr>`;}).join("")}</table><p style="margin-top:16px;font-size:12px">Generated ${new Date().toLocaleString()} · basis for invoice · payout: Takenos EUR IBAN (Malta)</p></body></html>`);}
 if(a==="record"&&lastSet){var t2=lastSet.reduce(function(a,b){return a+b.amount_pkr;},0);var rate=Number(document.getElementById("nxRate").value)||0.0033;var eur=Math.round(t2*rate*100)/100;
  sb.rpc("nx_record_settlement",{p_period:lastSetPer,p_amount_pkr:t2,p_amount_eur:eur,p_rate:rate,p_invoice:"NX-SET-"+lastSetPer,p_destination:"Takenos EUR IBAN (Malta)"}).then(function(r){if(r.error)alert(r.error.message);else{toast("Settlement recorded: "+eur+" EUR");document.querySelectorAll("[data-nxov]").forEach(function(o){o.remove();});refresh();document.body.insertAdjacentHTML("beforeend",adminOv());}});}
});
var _r=window.render;window.render=function(){var out=_r.apply(this,arguments);setTimeout(injectView,140);return out;};
setTimeout(injectView,600);
})();
</script>
</body>
