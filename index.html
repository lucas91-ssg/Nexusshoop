<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e2d3">
<meta name="google" content="notranslate">
<title>NexusShop — Trusted shops, pay on delivery</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e2d3;--bg2:#efe8d9;--sf:#f6f1e4;--sf2:#fbf8ef;--ln:#d9d0bb;--ln2:#c9bfa6;
--ink:#26221b;--ink2:#3a3428;--mut:#6b6355;--fnt:#8a8172;--grn:#1d5c3f;--grn2:#2f6b4f;--grn3:#4c8b6a;
--mint:#dcead9;--wa:#1d6b45;--gold:#8a6d1f;--goldbg:#f3e8c8;--red:#a33a2a;--redbg:#f4ded8;
--r:16px;--sh:0 10px 30px rgba(38,34,27,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.55;
background-image:radial-gradient(1100px 480px at 85% -10%,rgba(76,139,106,.10),transparent 60%),radial-gradient(900px 420px at -10% 110%,rgba(138,109,31,.08),transparent 60%)}
body.ur{font-family:'Noto Nastaliq Urdu','Segoe UI',serif}
body.hi{font-family:'Noto Sans Devanagari','Segoe UI',sans-serif}
body.ur h1,body.ur h2,body.ur h3,body.hi h1,body.hi h2,body.hi h3{line-height:1.95}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--grn3);border-radius:8px;border:2px solid var(--bg2)}
*{scrollbar-width:thin;scrollbar-color:var(--grn3) var(--bg2)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s,filter .15s}
button:active{transform:scale(.96)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%}
img{display:block;max-width:100%}
header{position:sticky;top:0;z-index:60;background:rgba(233,226,211,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;white-space:nowrap}.logo b{color:var(--grn)}
.sw{flex:1;min-width:130px;position:relative}.sw input{padding-inline-start:34px;border-radius:999px;background:var(--sf)}
.sw .sic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.icb{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 12px;font-size:14px;position:relative;color:var(--ink2)}
.bdg{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--grn);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.banner{background:var(--goldbg);border-bottom:1px solid var(--ln);color:var(--gold);font-size:12px;text-align:center;padding:7px 12px;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px 14px 110px}
.view{animation:rise .3s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:linear-gradient(135deg,var(--sf),var(--bg2));border:1px solid var(--ln);border-radius:24px;padding:30px 22px;margin-bottom:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero h1{font-size:clamp(26px,4.4vw,38px);line-height:1.2;margin-bottom:10px}
.hero p{color:var(--mut);font-size:14px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink);color:var(--sf);border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 6px 16px rgba(38,34,27,.12)}
.btn.grn{background:var(--grn);color:#fff}.btn.wa{background:var(--wa);color:#fff}
.btn.gh{background:transparent;border:1px solid var(--ink);color:var(--ink);box-shadow:none}.btn.sm{padding:8px 12px;font-size:12px;border-radius:10px}
.btn.red{background:var(--red);color:#fff}.btn.gold{background:var(--gold);color:#fff}
.trust{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--mut)}
.live{position:relative;border-radius:18px;margin:14px 0;padding:16px;border:1px solid var(--ln);background:linear-gradient(120deg,var(--goldbg),var(--mint),var(--goldbg));background-size:220% 220%;animation:grad 9s ease infinite}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.live b{font-size:15px}.live span{display:block;font-size:12px;color:var(--ink2);margin-top:4px}
h2.sec{font-size:19px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:18px;height:3px;background:var(--grn);border-radius:2px;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chips.sticky{position:sticky;top:102px;z-index:40;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 6px}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(38,34,27,.06)}
.pc .img{height:150px;background:var(--bg2);object-fit:cover;width:100%}
.pc .bd{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{font-size:14px;font-weight:700;color:var(--ink)}
.pr{color:var(--grn);font-weight:800;font-size:15px}.old{color:var(--fnt);text-decoration:line-through;font-size:12px}
.off{position:absolute;top:8px;inset-inline-start:8px;background:var(--gold);color:#fff;font-size:11px;border-radius:8px;padding:3px 7px}
.ht{position:absolute;top:8px;inset-inline-end:8px;background:rgba(246,241,228,.9);border:1px solid var(--ln);border-radius:999px;width:32px;height:32px;font-size:15px;color:var(--mut)}
.ht.on{color:var(--red)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:14px}
.mut{color:var(--mut);font-size:13px}.fnt{color:var(--fnt);font-size:12px}
.det{display:grid;gap:16px}@media(min-width:820px){.det{grid-template-columns:1fr 1fr}}
.det .img{border-radius:var(--r);height:320px;object-fit:cover;width:100%;background:var(--bg2)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:12px;background:var(--sf2)}
.qty button{width:36px;height:36px;font-size:18px;color:var(--ink2)}.qty span{min-width:36px;text-align:center}
.tc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}
.sl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cg{border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--sf)}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.ci:last-of-type{border-bottom:none}.ci img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.ci .gw{flex:1;min-width:0}.tot{display:flex;justify-content:space-between;font-weight:700;padding:10px 0}
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(233,226,211,.96);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mut);padding:6px 0;border-radius:14px}
nav button.on{color:var(--grn);font-weight:700;background:var(--mint)}nav .ico{font-size:18px}
.chk{width:60px;height:60px;border-radius:50%;background:var(--grn);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.ctr{text-align:center}.oc{font-family:Georgia,serif;font-size:20px;letter-spacing:1px;font-weight:700;margin:6px 0}
.st{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;background:var(--bg2);border:1px solid var(--ln);color:var(--mut)}
.st.placed{color:var(--gold);background:var(--goldbg);border-color:var(--gold)}
.st.delivered{color:var(--grn);background:var(--mint);border-color:var(--grn3)}
.modal{position:fixed;inset:0;background:rgba(38,34,27,.5);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--sf);border-radius:20px;padding:20px;max-width:540px;width:100%;max-height:86vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--sf);padding:10px 16px;border-radius:999px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .25s;max-width:92vw;display:flex;gap:12px;align-items:center;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.empty{padding:44px 10px;text-align:center;color:var(--mut)}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;color:var(--ink2)}
.rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.rail .rc{flex:0 0 150px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;cursor:pointer}
.rail .rc img{height:100px;width:100%;object-fit:cover;background:var(--bg2)}.rail .rc .b{padding:8px}
#raahFab{position:fixed;inset-inline-end:14px;bottom:86px;z-index:110;width:54px;height:54px;border-radius:50%;background:var(--grn);color:#fff;font-size:24px;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer}
#raah{position:fixed;inset-inline-end:14px;bottom:150px;z-index:115;width:min(360px,calc(100vw - 28px));max-height:60vh;background:var(--sf);border:1px solid var(--ln);border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
#raah .hd{background:var(--grn);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
#raah .msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--sf2)}
#raah .m{max-width:85%;padding:8px 12px;border-radius:14px;font-size:13px;white-space:pre-line}
#raah .m.u{align-self:flex-end;background:var(--grn);color:#fff;border-end-end-radius:4px}
#raah .m.a{align-self:flex-start;background:var(--sf);border:1px solid var(--ln);border-end-start-radius:4px}
#raah .ft{display:flex;gap:8px;padding:10px;background:var(--sf)}#raah .ft input{border-radius:999px}
.lrow{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;background:var(--sf2);flex-wrap:wrap}
.lrow img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.lrow .gw{flex:1;min-width:0}.lrow>.row{width:100%;justify-content:flex-end}
/* ===== Gate (bienvenida) ===== */
#nxGate{position:fixed;inset:0;z-index:500;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 15% -10%,rgba(76,139,106,.35),transparent 60%),radial-gradient(800px 460px at 110% 20%,rgba(214,51,108,.28),transparent 60%),radial-gradient(700px 500px at 50% 120%,rgba(245,159,0,.25),transparent 60%),linear-gradient(160deg,#101c16,#1d5c3f 55%,#0d1a13)}
#nxGate .orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;animation:ngFloat 9s ease-in-out infinite}
#nxGate .o1{width:260px;height:260px;background:#4c8b6a;top:-60px;left:-70px}
#nxGate .o2{width:200px;height:200px;background:#f59f00;bottom:-40px;right:-50px;animation-delay:1.6s}
#nxGate .o3{width:150px;height:150px;background:#d6336c;top:38%;right:8%;animation-delay:3.1s;opacity:.35}
@keyframes ngFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-30px) scale(1.12)}}
#nxGate .chipf{position:absolute;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);color:#eaf5ec;border-radius:999px;padding:7px 14px;font-size:11px;font-weight:700;animation:ngDrift 7s ease-in-out infinite}
#nxGate .c1{top:12%;left:10%}#nxGate .c2{top:20%;right:12%;animation-delay:1.2s}#nxGate .c3{bottom:16%;left:14%;animation-delay:2.2s}#nxGate .c4{bottom:10%;right:10%;animation-delay:3.4s}
@keyframes ngDrift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#nxGate .card{position:relative;width:min(430px,100%);background:rgba(251,248,239,.92);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);border-radius:28px;padding:26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center;animation:ngIn .55s cubic-bezier(.2,.9,.25,1.1)}
@keyframes ngIn{from{opacity:0;transform:translateY(34px) scale(.94)}to{opacity:1;transform:none}}
#nxGate.out .card{animation:ngOut .45s ease forwards}#nxGate.out .orb,#nxGate.out .chipf{animation:ngFade .45s ease forwards}
@keyframes ngOut{to{opacity:0;transform:translateY(-24px) scale(.9)}}@keyframes ngFade{to{opacity:0}}
#nxGate .ring{width:150px;height:100px;margin:0 auto 8px;perspective:700px}
#nxGate .spin{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:ngSpin 14s linear infinite}
@keyframes ngSpin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
#nxGate .spin img{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,255,255,.7)}
#nxGate h1{font-family:Georgia,serif;font-size:27px;color:#26221b;margin:2px 0 4px}#nxGate h1 b{background:linear-gradient(120deg,#1d5c3f,#4c8b6a,#8a6d1f);-webkit-background-clip:text;background-clip:text;color:transparent}
#nxGate .sub{font-size:12.5px;color:#6b6355;margin-bottom:14px}
#nxGate .glangs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
#nxGate .glangs button{border:1px solid #d9d0bb;background:#fbf8ef;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:#3a3428}
#nxGate .glangs button.on{background:#1d5c3f;color:#fff;border-color:#1d5c3f}
#nxGate .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #d9d0bb;border-radius:14px;padding:13px;font-weight:700;font-size:14px;color:#333;cursor:pointer}
#nxGate .div{display:flex;align-items:center;gap:10px;color:#8a8172;font-size:11px;margin:14px 0}#nxGate .div:before,#nxGate .div:after{content:'';flex:1;height:1px;background:#d9d0bb}
#nxGate input{width:100%;background:#fbf8ef;border:1px solid #d9d0bb;border-radius:12px;padding:11px 13px;font-size:13.5px;color:#26221b;margin-bottom:9px;outline:none}
#nxGate .row2{display:flex;gap:8px}#nxGate .row2 button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:13px;cursor:pointer}
#nxGate .li{background:#1d5c3f;color:#fff;border:none}#nxGate .su{background:transparent;color:#1d5c3f;border:1.5px solid #1d5c3f}
#nxGate .err{color:#a33a2a;font-size:11.5px;margin-top:8px;min-height:14px}
#nxGate .demo{margin-top:10px;font-size:11px;color:#6b6355;text-decoration:underline;cursor:pointer}
/* ===== Selector de idioma premium ===== */
#nxLangScrim{position:fixed;inset:0;z-index:520;background:rgba(15,12,8,.55);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center}
#nxLangScrim.on{display:flex}
@media(min-width:640px){#nxLangScrim.on{align-items:center}}
#nxLangSheet{width:100%;max-width:430px;background:linear-gradient(180deg,rgba(251,248,239,.97),rgba(246,241,228,.97));backdrop-filter:blur(20px);border-radius:28px 28px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.4);transform:translateY(60px);opacity:0;transition:transform .38s cubic-bezier(.2,.9,.25,1.05),opacity .3s;position:relative;overflow:hidden}
@media(min-width:640px){#nxLangSheet{border-radius:28px}}
#nxLangScrim.on #nxLangSheet{transform:none;opacity:1}
#nxLangSheet:before{content:'';position:absolute;top:0;left:10%;right:10%;height:4px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--grn),var(--gold),var(--grn3))}
#nxLangSheet .orb{position:absolute;border-radius:50%;filter:blur(34px);opacity:.25;pointer-events:none}
#nxLangSheet .oa{width:150px;height:150px;background:var(--grn3);top:-50px;right:-40px;animation:nlF 7s ease-in-out infinite}
#nxLangSheet .ob{width:110px;height:110px;background:var(--gold);bottom:-30px;left:-30px;animation:nlF 9s ease-in-out infinite reverse}
@keyframes nlF{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,12px)}}
#nxLangSheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:4px;position:relative}
#nxLangSheet .hd .gl{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--grn),var(--grn3));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
#nxLangSheet .hd b{font-family:Georgia,serif;font-size:17px;color:var(--ink);display:block}
#nxLangSheet .hd span{font-size:11.5px;color:var(--mut)}
#nxLangSheet .x{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;background:var(--sf2);border:1px solid var(--ln);color:var(--mut);font-size:14px;cursor:pointer}
#nxLangList{margin-top:12px;max-height:52vh;overflow-y:auto;padding-right:4px;position:relative}
.nlRow{display:flex;align-items:center;gap:12px;width:100%;background:var(--sf2);border:1.5px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .16s}
.nlRow:hover{transform:translateX(3px);border-color:var(--grn3)}
.nlRow.on{background:var(--mint);border-color:var(--grn)}
.nlRow .fl{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.nlRow .nm{flex:1;text-align:start}.nlRow .nm b{display:block;font-size:15px;color:var(--ink)}.nlRow .nm span{font-size:11px;color:var(--mut);display:block}
.nlRow .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln2);flex:none}
.nlRow.on .ck{border-color:var(--grn);background:var(--grn);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
#nxLangSheet .ft{margin-top:6px;text-align:center;font-size:11px;color:var(--fnt);position:relative}
/* ===== Pill Install ===== */
#nxInstallPill{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:106;display:none;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:999px;background:rgba(29,92,63,.9);color:#fff;box-shadow:0 10px 30px rgba(29,92,63,.35);cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:transform .5s cubic-bezier(.2,.9,.25,1.1),opacity .4s}
#nxInstallPill.on{display:flex;transform:translate(-50%,0);opacity:1}
#nxInstallPill .i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#dcead9,#8fd6a8);color:#1d5c3f;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none}
#nxInstallPill .x{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:11px}
#nxInstallPill.out{transform:translate(-50%,140%);opacity:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
const I18N={
