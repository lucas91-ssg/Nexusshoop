<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexusShop — Trusted Pakistani shops, pay on delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9e2d3; --surface:#f6f1e4; --surface2:#efe8d9; --line:#d9d0bb;
  --ink:#26221b; --muted:#6b6355; --green:#1d5c3f; --green2:#2f6b4f;
  --wa:#1d6b45; --danger:#a33a2a; --amber:#8a6d1f; --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
body.ur{font-family:'Noto Nastaliq Urdu',Georgia,serif}
body.ur h1,body.ur h2,body.ur h3{line-height:1.9}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--surface2)}
::-webkit-scrollbar-thumb{background:var(--green2);border-radius:8px;border:2px solid var(--surface2)}
::-webkit-scrollbar-thumb:hover{background:var(--green)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:active{transform:scale(.97)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);outline-offset:1px}
img{display:block;max-width:100%}
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:700;white-space:nowrap}
.logo b{color:var(--green)}
.searchwrap{flex:1;min-width:150px;position:relative}
.searchwrap input{padding-inline-start:34px;border-radius:999px}
.searchwrap span{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:14px;position:relative}
.badge{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--green);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-family:system-ui}
.banner{background:var(--surface2);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;padding:6px 12px;font-family:system-ui}
main{max-width:1080px;margin:0 auto;padding:16px 14px 100px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:26px 22px;margin-bottom:18px}
.hero h1{font-size:clamp(24px,4vw,34px);line-height:1.25;margin-bottom:10px}
.hero p{color:var(--muted);font-size:14px;margin-bottom:16px;font-family:system-ui}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--surface);border-radius:12px;padding:12px 18px;font-weight:700;font-family:system-ui;font-size:14px}
.btn.green{background:var(--green);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:12px}
.btn.danger{background:var(--danger);color:#fff}
.trust{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted);font-family:system-ui}
h2.sec{font-size:18px;margin:18px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;white-space:nowrap;font-family:system-ui}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative;display:flex;flex-direction:column}
.pcard .img{height:150px;background:var(--surface2);object-fit:cover;width:100%}
.pcard .body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .name{font-size:14px;font-weight:700}
.price{color:var(--green);font-weight:700;font-family:system-ui}
.old{color:var(--muted);text-decoration:line-through;font-size:12px;font-family:system-ui}
.off{position:absolute;top:8px;inset-inline-start:8px;background:var(--ink);color:#fff;font-size:11px;border-radius:8px;padding:3px 7px;font-family:system-ui}
.heart{position:absolute;top:8px;inset-inline-end:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:32px;height:32px;font-size:15px}
.heart.on{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.muted{color:var(--muted);font-family:system-ui;font-size:13px}
.detail{display:grid;gap:16px}
@media(min-width:800px){.detail{grid-template-columns:1fr 1fr}}
.detail .img{border-radius:var(--radius);height:320px;object-fit:cover;width:100%;background:var(--surface2)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qty button{width:36px;height:36px;font-size:18px}
.qty span{min-width:36px;text-align:center;font-family:system-ui}
.trustcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px;font-family:system-ui}
.sellerline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cartgroup{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--surface)}
.cartitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cartitem img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.cartitem .grow{flex:1}
.total{display:flex;justify-content:space-between;font-weight:700;padding:10px 0;font-family:system-ui}
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);font-family:system-ui;position:relative}
nav button.on{color:var(--green);font-weight:700}
nav .ico{font-size:18px}
.check{width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.center{text-align:center}
.ordercode{font-size:20px;letter-spacing:1px;font-weight:700;margin:6px 0}
.status{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-family:system-ui;background:var(--surface2);border:1px solid var(--line)}
.status.placed{color:var(--amber)} .status.delivered{color:var(--green)}
.modal{position:fixed;inset:0;background:rgba(20,17,12,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.steps{display:flex;flex-direction:column;gap:0;margin:14px 0}
.step{display:flex;gap:12px;align-items:flex-start}
.step .dot{width:14px;height:14px;border-radius:50%;background:var(--line);margin-top:4px;flex:none}
.step.done .dot{background:var(--green)}
.step .lbl{font-size:13px;font-family:system-ui;padding-bottom:18px;border-inline-start:2px solid var(--line);margin-inline-start:-8px;padding-inline-start:18px}
.step:last-child .lbl{border:none}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-family:system-ui}
details{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface)}
summary{cursor:pointer;font-weight:700}
details p{margin-top:8px;font-size:13px;color:var(--muted);font-family:system-ui;white-space:pre-line}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:13px;font-family:system-ui;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-family:system-ui;font-size:14px}
</style>
</head>

 <div class="card"><b>${esc(t(editing?"editProduct":"addProduct"))}</b>
 <label>${esc(t("pName"))}</label><input id="mpName" value="${editing?esc(pname(editing)):""}">
 <label>${esc(t("pPrice"))}</label><input id="mpPrice" type="number" value="${editing?editing.price:""}">
 <label>${esc(t("pCat"))}</label><select id="mpCat">${CATS.map(c=>`<option value="${c.id}" ${editing&&editing.cat===c.id?"selected":""}>${esc(catName(c.id))}</option>`).join("")}</select>
 <label>${esc(t("pStock"))}</label><input id="mpStock" type="number" value="${editing?editing.stock:10}">
 <label>${esc(t("pImg"))}</label><input id="mpImg" value="${editing?editing.img:""}">
 <label>${esc(t("pDesc"))}</label><textarea id="mpDesc" rows="2">${editing?esc(pdesc(editing)):""}</textarea>
 <button class="btn green" style="margin-top:12px" data-a="mpSave">${esc(t(editing?"editProduct":"addProduct"))}</button></div>
 <h2 class="sec">${esc(t("myProducts"))} (${S.myProducts.length})</h2>
 ${S.myProducts.length?S.myProducts.map(p=>`<div class="card sellerline"><div><b>${esc(pname(p))}</b><div class="price">${money(p.price)}</div></div><div class="row"><button class="btn ghost small" data-a="mpEdit" data-id="${p.id}">${esc(t("edit"))}</button><button class="btn danger small" data-a="mpDel" data-id="${p.id}">${esc(t("del"))}</button></div></div>`).join(""):`<div class="empty">${esc(t("noResults"))}</div>`}
 <div class="card"><b>${esc(t("payTitle"))}</b>
 <label>${esc(t("bank"))}</label><select id="payBank"><option>JazzCash</option><option>Easypaisa</option><option>HBL</option><option>Meezan</option></select>
 <label>${esc(t("amount"))}</label><input id="payAmt" type="number" value="2500">
 <label>${esc(t("sender"))}</label><input id="payName">
 <label>${esc(t("last4"))}</label><input id="payLast" maxlength="4">
 <label>${esc(t("tid"))}</label><input id="payTid">
 <button class="btn green" style="margin-top:12px" data-a="paySend">${esc(t("submitPay"))}</button></div>
 <button class="btn ghost" style="width:100%" data-a="nav" data-v="faq">❓ ${esc(t("faq"))}</button>`;}
function vCommittee(){return `<h2 class="sec">${esc(t("commT"))}</h2><div class="card muted">${esc(t("commS"))}</div>
 <div class="row"><button class="btn green" data-a="gStart">${esc(t("startGroup"))}</button></div>
 <div class="card" style="margin-top:12px"><label>${esc(t("code"))}</label><input id="gCode"><button class="btn ghost" style="margin-top:10px" data-a="gJoin">${esc(t("joinGroup"))}</button></div>
 ${S.groups.map(g=>`<div class="card sellerline"><div><b>${g.code}</b><div class="muted">${g.members}/3 ${esc(t("members"))}</div></div><div class="row"><span class="status ${g.members>=3?"delivered":"placed"}">${esc(t(g.members>=3?"locked":"open"))}</span><button class="btn wa small" data-a="gShare" data-id="${g.code}">${esc(t("share"))}</button></div></div>`).join("")}`;}
function vSettings(){return `<h2 class="sec">${esc(t("settings"))}</h2>
 <div class="card"><label>${esc(t("lang"))}</label><select id="setLang"><option value="en" ${S.lang==="en"?"selected":""}>English</option><option value="ur" ${S.lang==="ur"?"selected":""}>اردو</option></select>
 <label>${esc(t("market"))}</label><select id="setMarket"><option value="PK" ${S.market==="PK"?"selected":""}>🇵 Pakistan (Rs)</option><option value="NG" ${S.market==="NG"?"selected":""}>🇳 Nigeria (₦)</option></select>
 <div class="muted" style="margin-top:10px">${esc(t("themeNote"))}</div>
 <label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="setAdmin" style="width:auto" ${S.admin?"checked":""}> ${esc(t("admin"))}</label></div>
 ${S.admin?`<div class="card"><b>${esc(t("payQueue"))}</b>${S.payments.length?S.payments.map(p=>`<div class="cartitem"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.bank)} · ${money(p.amt)} · TID ${esc(p.tid)}</div><span class="status ${p.status==="verified"?"delivered":"placed"}">${esc(t(p.status))}</span></div>${p.status==="pending"?`<div class="row"><button class="btn green small" data-a="payOk" data-id="${p.id}">${esc(t("approve"))}</button><button class="btn danger small" data-a="payNo" data-id="${p.id}">${esc(t("reject"))}</button></div>`:""}</div>`).join(""):`<div class="muted">—</div>`}</div>`:""}
 <details><summary>${esc(t("about"))}</summary><p>${esc(t("aboutT"))}</p></details>
 <details><summary>${esc(t("privacy"))}</summary><p>${esc(t("privacyT"))}</p></details>
 <details><summary>${esc(t("terms"))}</summary><p>${esc(t("termsT"))}</p></details>
 <details><summary>${esc(t("support"))}</summary><p>${esc(t("supportT"))}</p></details>
 <button class="btn danger" style="width:100%" data-a="reset">${esc(t("reset"))}</button>`;}
function vFaq(){const qs=[1,2,3,4,5,6,7,8];return `<h2 class="sec">${esc(t("faqT"))}</h2>`+qs.map(i=>`<details ${i===1?"open":""}><summary>${esc(t("q"+i))}</summary><p>${esc(t("a"+i))}</p></details>`).join("");}
function trackModal(){const o=S.orders.find(x=>x.code===S.track);if(!o)return "";const steps=["placed","confirmed","shipped","delivered"];const idx=steps.indexOf(o.status);const m=MK[S.market];
 return `<div class="modal" data-a="closeTrack"><div class="box" onclick="event.stopPropagation()"><div class="sellerline"><b>${esc(t("trackT"))}</b><button class="btn ghost small" data-a="closeTrack">✕</button></div>
 <div class="ordercode">${o.code}</div><div class="muted">${esc(o.seller)} · ${money(o.total)}</div>
 <div class="steps">${steps.map((s,i)=>`<div class="step ${i<=idx?"done":""}"><div class="dot"></div><div class="lbl">${esc(t("status_"+s))}</div></div>`).join("")}</div>
 <div class="trustcard"><div>🚚 ${esc(t("courier"))}: ${esc(m.couriers[0])}</div><div>📅 ${esc(t("est"))}: 2–4 ${S.lang==="ur"?"دن":"days"}</div></div>
 <button class="btn wa" style="width:100%;margin-top:12px" data-a="waorder" data-id="${o.code}">💬 ${esc(t("msgSeller"))}</button></div></div>`;}
/* ============ actions ============ */
function addCart(id,q){const it=S.cart.find(x=>x.id===id);if(it)it.q+=q;else S.cart.push({id,q});save();toast(t("added"));render();}
function waLink(num,msg){window.open("https://wa.me/"+String(num).replace(/\D/g,"")+"?text="+encodeURIComponent(msg),"_blank");}
function orderMsg(o){return t("waHello")+"\n"+o.items.map(i=>{const p=prod(i.id);return "• "+(p?pname(p):i.id)+" x"+i.q;}).join("\n")+"\n"+t("waTotal")+": "+money(o.total)+"\n"+o.code;}
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 switch(a){
  case "nav":S.view=el.dataset.v;S.track=null;S.editId=null;save();render();window.scrollTo(0,0);break;
  case "lang":S.lang=S.lang==="en"?"ur":"en";save();render();toast(t("langSet"));break;
  case "market":S.market=S.market==="PK"?"NG":"PK";save();render();toast(t("marketSet"));break;
  case "shopnow":S.view="home";render();setTimeout(()=>{const g=document.getElementById("grid");if(g)g.scrollIntoView({behavior:"smooth"});},50);break;
  case "cat":S.cat=id;render();break;
  case "open":S.pid=id;S.qty=1;S.view="detail";save();render();window.scrollTo(0,0);break;
  case "save":{const i=S.saved.indexOf(id);if(i>=0){S.saved.splice(i,1);toast(t("unsavedT"));}else{S.saved.push(id);toast(t("savedT"));}save();render();break;}
  case "add":addCart(id,1);break;
  case "addq":addCart(id,S.qty);break;
  case "buy":addCart(id,S.qty);S.view="cart";render();break;
  case "q":S.qty=Math.max(1,S.qty+Number(el.dataset.d));render();break;
  case "cq":{const it=S.cart.find(x=>x.id===id);if(it){it.q+=Number(el.dataset.d);if(it.q<1)S.cart=S.cart.filter(x=>x.id!==id);}save();render();break;}
  case "rm":S.cart=S.cart.filter(x=>x.id!==id);save();toast(t("removed"));render();break;
  case "ask":{const p=prod(id);waLink(p.swa,t("waHello")+" "+pname(p));break;}
  case "checkout":{if(!S.cart.length)break;const G={};S.cart.forEach(it=>{const p=prod(it.id);(G[p.seller]=G[p.seller]||[]).push(it);});
    const m=MK[S.market];S.lastOrders=Object.keys(G).map(s=>{const items=G[s];const sub=items.reduce((a,b)=>a+prod(b.id).price*b.q,0);const del=sub>=m.free?0:m.del;
      const o={code:"NX-"+Math.random().toString(36).slice(2,8).toUpperCase(),seller:s,swa:prod(items[0].id).swa,items,total:sub+del,status:"placed",ts:Date.now()};S.orders.unshift(o);return o;});
    S.cart=[];S.view="placed";save();render();window.scrollTo(0,0);break;}
  case "waorder":{const o=S.orders.find(x=>x.code===id);if(o)waLink(o.swa,orderMsg(o));break;}
  case "track":S.track=id;render();break;
  case "closeTrack":S.track=null;render();break;
  case "pfSave":S.profile={name:val("pfName"),city:val("pfCity"),wa:val("pfWa")};save();toast(t("profileSaved"));render();break;
  case "shCreate":{const n=val("shName");if(!n){toast(t("shopName"));break;}S.shop={name:n,city:val("shCity"),wa:val("shWa"),plan:"free"};save();toast(t("shopCreated"));render();break;}
  case "mpSave":{const n=val("mpName"),pr=Number(val("mpPrice"));if(!n||!pr){toast(t("pName"));break;}
    if(!S.editId&&S.shop.plan==="free"&&S.myProducts.length>=5){toast(t("limit"));break;}
    const data={name:{en:n,ur:n},desc:{en:val("mpDesc"),ur:val("mpDesc")},price:pr,cat:val("mpCat"),stock:Number(val("mpStock"))||10,img:val("mpImg")||"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&q=70",seller:S.shop.name,swa:S.shop.wa,city:S.shop.city,rating:4.5,rc:0};
    if(S.editId){const p=S.myProducts.find(x=>x.id===S.editId);Object.assign(p,data);S.editId=null;toast(t("prodUpdated"));}
    else{S.myProducts.push(Object.assign({id:"my"+Date.now()},data));toast(t("prodAdded"));}
    save();render();break;}
  case "mpEdit":S.editId=id;render();window.scrollTo(0,0);break;
  case "mpDel":if(confirm(t("confirmDel"))){S.myProducts=S.myProducts.filter(x=>x.id!==id);S.cart=S.cart.filter(x=>x.id!==id);save();toast(t("prodDeleted"));render();}break;
  case "paySend":{const tid=val("payTid"),nm=val("payName");if(!tid||!nm){toast(t("tid"));break;}S.payments.unshift({id:"pay"+Date.now(),bank:val("payBank"),amt:Number(val("payAmt"))||2500,name:nm,last4:val("payLast"),tid,status:"pending",shop:S.shop?S.shop.name:""});save();toast(t("paySent"));render();break;}
  case "payOk":{const p=S.payments.find(x=>x.id===id);if(p){p.status="verified";if(S.shop&&p.shop===S.shop.name)S.shop.plan="premium";}save();toast(t("payOk"));render();break;}
  case "payNo":{const p=S.payments.find(x=>x.id===id);if(p)p.status="rejected";save();toast(t("payNo"));render();break;}
  case "gStart":{const g={code:"NX"+Math.floor(1000+Math.random()*9000),members:1};S.groups.unshift(g);save();toast(t("groupCreated"));render();break;}
  case "gJoin":{const c=val("gCode").toUpperCase();const g=S.groups.find(x=>x.code===c);if(!g){toast(t("codeNo"));break;}if(g.members<3)g.members++;save();toast(g.members>=3?t("groupFull"):t("groupJoined"));render();break;}
  case "gShare":{const g=S.groups.find(x=>x.code===id);waLink("","Join my NexusShop committee "+g.code+" — everyone saves 15% (COD).");break;}
  case "reset":if(confirm(t("confirmReset"))){localStorage.removeItem("nx_clean_v1");location.reload();}break;
 }
});
function val(id){const el=document.getElementById(id);return el?el.value.trim():"";}
document.addEventListener("input",e=>{if(e.target.id==="search"){S.search=e.target.value;const g=document.getElementById("grid");if(g){const list=prods().filter(p=>(S.cat==="all"||p.cat===S.cat)&&(!S.search||pname(p).toLowerCase().includes(S.search.toLowerCase())||p.seller.toLowerCase().includes(S.search.toLowerCase())));g.innerHTML=list.length?list.map(card).join(""):`<div class="empty" style="grid-column:1/-1">${esc(t("noResults"))}</div>`;}}});
document.addEventListener("change",e=>{if(e.target.id==="setLang"){S.lang=e.target.value;save();render();toast(t("langSet"));}if(e.target.id==="setMarket"){S.market=e.target.value;save();render();toast(t("marketSet"));}if(e.target.id==="setAdmin"){S.admin=e.target.checked;save();render();}});
render();
</script>
</body>
